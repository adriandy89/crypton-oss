# Cliente web de CRYPTON.
#
# Dos trabajos: servir la aplicacion compilada y hacer de proxy de la API en el
# MISMO origen. Lo segundo es lo importante: con /api/v1 colgando del mismo
# dominio no hay CORS que configurar, y cambiar el dominio del despliegue no
# obliga a reconstruir la imagen (ver apps/app/src/environments/environment.docker.ts).
#
# REQUISITO DEL DESPLIEGUE: esto tiene que servirse por HTTPS. La entrada con
# Google usa PKCE, que se apoya en crypto.subtle, y el navegador solo lo expone
# en contexto seguro. Por HTTP plano —salvo en localhost— el boton de entrar no
# hace nada. Aqui dentro no se termina TLS: lo hace el proxy que haya delante.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirecciones relativas: al ir detras de un proxy, una absoluta delataria
    # el host interno del contenedor (http://localhost:8080/...) en vez del
    # dominio publico.
    absolute_redirect off;

    # Docker resuelve los nombres de servicio en 127.0.0.11. Se declara el
    # resolver y la URL va en una variable a proposito: asi nginx resuelve
    # crypton-api en cada peticion y no al arrancar. Sin esto, levantar el
    # cliente web con la API todavia parando aborta el arranque de nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # OJO con estas tres: en nginx, un `location` que declare SU PROPIO
    # add_header descarta TODOS los heredados del nivel server. Por eso se
    # repiten abajo en los dos bloques que añaden cabeceras de caché. No es
    # duplicación por descuido: quitarlas deja el index y los bundles sin
    # nosniff.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── Flujo de eventos del motor ────────────────────────────────────────
    # Va ANTES del bloque general de /api/ porque necesita lo contrario que el
    # resto: sin buffering (o los eventos llegarian a tirones, en bloques) y sin
    # timeout de lectura (la conexion esta abierta y en silencio largos ratos).
    location = /api/v1/bots/stream {
        set $upstream_api http://crypton-api:3200;
        proxy_pass $upstream_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    # ── Resto de la API ───────────────────────────────────────────────────
    # `^~` no es decorativo: sin el, nginx evalua ANTES la regex de estaticos de
    # mas abajo, y cualquier ruta de la API terminada en .js o .css —Swagger UI
    # sirve varias— se buscaria en disco y devolveria 404 en vez de ir al proxy.
    location ^~ /api/ {
        set $upstream_api http://crypton-api:3200;
        proxy_pass $upstream_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Estaticos ─────────────────────────────────────────────────────────
    # Todo lo que Angular emite lleva hash en el nombre, asi que se puede
    # cachear para siempre: si cambia el contenido, cambia el nombre.
    location ~* \.(?:js|css|woff2|woff|ttf|png|jpe?g|gif|webp|avif|ico)$ {
        # Un solo Cache-Control: `expires 1y` emitiria otro por su cuenta y la
        # respuesta saldria con la cabecera duplicada.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        access_log off;
        try_files $uri =404;
    }

    # El indice NO se cachea: es el unico archivo sin hash, y es el que dice
    # cuales son los bundles buenos. Cachearlo deja al navegador pidiendo
    # ficheros que ya no existen despues de cada despliegue.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Rutas de la aplicacion: /tabs/bots, /bots/:id... no son ficheros. Todas
    # las sirve el indice y el enrutador de Angular decide.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
